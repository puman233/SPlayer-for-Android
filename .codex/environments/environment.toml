# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "SPlayer-Android"

[setup]
script = ""

[[actions]]
name = "安卓打包"
icon = "tool"
command = '''
$ErrorActionPreference = "Stop"

if (-not (Test-Path "android/key.properties")) {
  throw "缺少 android/key.properties，不能打发行版签名包"
}

if (-not (Test-Path ".env") -and (Test-Path ".env.example")) {
  Copy-Item ".env.example" ".env"
}

pnpm lint
pnpm build:android

Push-Location "android"
try {
  .\gradlew.bat assembleRelease
} finally {
  Pop-Location
}

Write-Host ""
Write-Host "发行版 APK 输出目录："
Write-Host "E:\SPlayer-Android\android\app\build\outputs\apk\release"
Get-ChildItem "android\app\build\outputs\apk\release" -Filter "*.apk" | Select-Object Name, Length
'''
platform = "win32"
